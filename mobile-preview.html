<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EverydayGass — mobile view</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter Tight", system-ui, sans-serif;
      background: #dfe0e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      color: #000;
    }
    h1 {
      font-size: .78rem;
      margin: 0 0 6px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    p {
      margin: 0 0 16px;
      color: #6a6a6a;
      font-size: .85rem;
      text-align: center;
      max-width: 420px;
    }
    .phone {
      width: 417px;
      height: 900px;
      background: #000;
      border-radius: 55px;
      padding: 44px 12px 12px;
      box-shadow: 0 30px 80px rgba(0,0,0,.18);
      position: relative;
      flex-shrink: 0;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 28px;
      background: #111;
      border-radius: 24px;
      z-index: 2;
    }
    iframe {
      width: 393px;
      height: 852px;
      border: 0;
      border-radius: 47px;
      background: #fff;
      display: block;
    }
  </style>
</head>
<body>
  <h1>EverydayGass · iPhone 15</h1>
  <p>Commercial site in a phone frame, to use on your PC. Scroll and tap inside the device.</p>
  <div class="phone">
    <iframe src="index.html" title="EverydayGass mobile"></iframe>
  </div>
</body>
</html>
